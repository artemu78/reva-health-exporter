name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Validate release tag
        run: ./gradlew verifyReleaseTag -PreleaseTag="$GITHUB_REF_NAME"
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          printf %s "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
      - name: Test and build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "$secret_name is not configured"
              exit 1
            fi
          done
          ./gradlew test lintRelease assembleRelease
      - name: Verify and name APK
        run: |
          build_tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          apksigner_path="$build_tools_dir/apksigner"
          aapt2_path="$build_tools_dir/aapt2"
          "$apksigner_path" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$aapt2_path" dump badging app/build/outputs/apk/release/app-release.apk | head -1
          cp app/build/outputs/apk/release/app-release.apk \
            "reva-health-exporter-${GITHUB_REF_NAME}.apk"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "reva-health-exporter-${GITHUB_REF_NAME}.apk#Reva Health Exporter ${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "Reva Health Exporter ${GITHUB_REF_NAME}"
